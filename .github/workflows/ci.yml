# Fail-slow CI: independent jobs, no fail-fast, each job streams its own result as it finishes.
# The aggregate still fails if any required job fails. Blocked != failed (see `needs`).
name: ci
on:
  push:
    branches: [main, integration, 'swarm/**']
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q ruff
      - run: ruff check src tests
      - if: always()
        uses: ./.github/actions/report
        with:
          job: lint
          outcome: ${{ job.status }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -e ".[dev]" pyright
      - run: pyright src || true   # advisory for now; flipped to required once the baseline is clean
      - if: always()
        uses: ./.github/actions/report
        with:
          job: typecheck
          outcome: ${{ job.status }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # the point: one red shard must not cancel the others
      matrix:
        shard: [items, movements, reports_search]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -e ".[dev]"
      # -p no:cacheprovider + no -x: collect every failure in the shard, not just the first.
      - run: python -m pytest -q tests/test_${{ matrix.shard }}.py --junitxml=junit-${{ matrix.shard }}.xml -p no:cacheprovider
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
      - if: always()
        uses: ./.github/actions/report
        with:
          job: test-${{ matrix.shard }}
          outcome: ${{ job.status }}
          junit: junit-${{ matrix.shard }}.xml

  aggregate:
    needs: [lint, typecheck, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }}"
          [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ]
